      top: 15px;

      margin: 0;
      font-size: 16px;

  <!-- LÓGICA DO JOGO (JAVASCRIPT) -->
  <script>
    let pontos = 0;
    let emArremesso = false;
    let audioCtx = null;

    // Gerador de Texturas do Piso e Tabela via Canvas
    window.addEventListener('load', () => {
      // 1. Textura do Piso
      const cPiso = document.getElementById('canvas-piso');
      const ctxP = cPiso.getContext('2d');
      ctxP.fillStyle = '#2e1065';
      ctxP.fillRect(0, 0, 1024, 1024);
      
      // Linhas da Quadra em Dourado / Lilás
      ctxP.strokeStyle = '#c084fc';
      ctxP.lineWidth = 12;
      ctxP.strokeRect(40, 40, 944, 944);

      // Círculo Central com Logo SENAI x BTS
      ctxP.beginPath();
      ctxP.arc(512, 512, 220, 0, 2 * Math.PI);
      ctxP.fillStyle = '#581c87';
      ctxP.fill();
      ctxP.stroke();

      ctxP.fillStyle = '#ffffff';
      ctxP.font = 'bold 54px Arial';
      ctxP.textAlign = 'center';
      ctxP.fillText('SENAI x BTS', 512, 500);
      ctxP.font = 'bold 32px Arial';
      ctxP.fillStyle = '#f472b6';
      ctxP.fillText('BORAHAE COURT 💜', 512, 550);

      // 2. Textura da Tabela
      const cTab = document.getElementById('canvas-tabela');
      const ctxT = cTab.getContext('2d');
      ctxT.fillStyle = '#ffffff';
      ctxT.fillRect(0, 0, 512, 256);
      
      ctxT.fillStyle = '#581c87';
      ctxT.fillRect(0, 0, 512, 55);
      
      ctxT.fillStyle = '#ffffff';
      ctxT.font = 'bold 28px Arial';
      ctxT.textAlign = 'center';
      ctxT.fillText('SENAI  x  BTS 💜', 256, 38);

      ctxT.strokeStyle = '#a855f7';
      ctxT.lineWidth = 8;
      ctxT.strokeRect(176, 120, 160, 110);
    });

    // Posições-chave da simulação
    const posInicial = { x: 0, y: 1.05, z: -1.5 }; // Pedestal
    const posAroBase = { x: 0, y: 3.0, z: -6.7 };  // Aro
    const posChao = { x: 0, y: 0.22, z: -6.7 };     // Chão

    const bola = document.querySelector('#bola');
    const txtPlacar = document.querySelector('#txt-placar');

    // Áudio via Web Audio API
    function inicializarAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function tocarSom(tipo) {
      inicializarAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const agora = audioCtx.currentTime;

      if (tipo === 'lancar') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, agora);
        osc.frequency.exponentialRampToValueAtTime(600, agora + 0.2);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.linearRampToValueAtTime(0.01, agora + 0.2);
        osc.start(agora);
        osc.stop(agora + 0.2);
      } else if (tipo === 'cesta') {
        // Melodia K-Pop em Acorde Vibrante de Comemoração
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, agora);        // Dó (C5)
        osc.frequency.setValueAtTime(659.25, agora + 0.1);  // Mi (E5)
        osc.frequency.setValueAtTime(783.99, agora + 0.2);  // Sol (G5)
        osc.frequency.setValueAtTime(1046.50, agora + 0.3); // Dó (C6)
        gain.gain.setValueAtTime(0.35, agora);
        gain.gain.linearRampToValueAtTime(0.01, agora + 0.6);
        osc.start(agora);
        osc.stop(agora + 0.6);
      } else if (tipo === 'quique') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, agora);
        osc.frequency.exponentialRampToValueAtTime(40, agora + 0.1);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.linearRampToValueAtTime(0.01, agora + 0.1);
        osc.start(agora);
        osc.stop(agora + 0.1);
      }
    }

    // ARREMESSO DIRETO E SUAVE
    function arremessarBola() {
      if (emArremesso) return;
      emArremesso = true;

      tocarSom('lancar');

      const duracaoArremesso = 1100; // 1.1s voo perfeito
      const tempoInicio = Date.now();

      const destinoX = posAroBase.x;
      const destinoY = posAroBase.y;
      const destinoZ = posAroBase.z;

      // Trajetória em arco parabólico direto para a cesta
      const animacaoArremesso = setInterval(() => {
        const tempoDecorrido = Date.now() - tempoInicio;
        let progresso = tempoDecorrido / duracaoArremesso;

        if (progresso >= 1) {
          clearInterval(animacaoArremesso);

          // Cesta certeira!
          pontos += 1;
          txtPlacar.setAttribute('value', 'BORAHAE PONTOS: ' + pontos + ' 💜');
          tocarSom('cesta');
          animarQuedaEQuique();

        } else {
          const currX = posInicial.x + (destinoX - posInicial.x) * progresso;
          const currZ = posInicial.z + (destinoZ - posInicial.z) * progresso;
          
          const alturaArco = Math.sin(progresso * Math.PI) * 2.0;
          const currY = posInicial.y + (destinoY - posInicial.y) * progresso + alturaArco;

          bola.setAttribute('position', `${currX} ${currY} ${currZ}`);
          bola.setAttribute('rotation', `${progresso * 720} ${progresso * 360} 0`);
        }
      }, 16);
    }

    // Queda da bola pela rede e quique no chão
    function animarQuedaEQuique() {
      let tempoInicioQueda = Date.now();
      const duracaoQueda = 400;

      const animQueda = setInterval(() => {
        let prog = (Date.now() - tempoInicioQueda) / duracaoQueda;
        if (prog >= 1) {
          clearInterval(animQueda);
          
          bola.setAttribute('position', `0 ${posChao.y} ${posChao.z}`);
          tocarSom('quique');

          setTimeout(() => { tocarSom('quique'); }, 220);

          // Reiniciar bola no pedestal
          setTimeout(() => {
            bola.setAttribute('position', `${posInicial.x} ${posInicial.y} ${posInicial.z}`);
            bola.setAttribute('rotation', '0 0 0');
            emArremesso = false;
          }, 600);

        } else {
          const currY = posAroBase.y - (posAroBase.y - posChao.y) * Math.pow(prog, 2);
          bola.setAttribute('position', `0 ${currY} ${posAroBase.z}`);
        }
      }, 16);
    }

    // Arremessa ao olhar ou clicar na bola
    bola.addEventListener('click', arremessarBola);
  </script>
